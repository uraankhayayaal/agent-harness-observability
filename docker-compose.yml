services:
  postgres:
    image: postgres:16-alpine
    container_name: harness-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harness_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness_password}
      POSTGRES_DB: ${POSTGRES_DB:-harness_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harness_user} -d ${POSTGRES_DB:-harness_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20-community
    container_name: harness-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-harness_password}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-harness_password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: harness-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: harness-kafdrop
    platform: linux/amd64
    ports:
      - "${KAFDROP_PORT:-9000}:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka

  backend:
    build: ./backend
    container_name: harness-backend
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      API_BASE_PATH: ${API_BASE_PATH:-/v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-agent-harness-metrics}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-agent-metrics-analyzer}
      KAFKA_START_OFFSET: ${KAFKA_START_OFFSET:-last}
      KAFKA_FETCH_MIN_BYTES: ${KAFKA_FETCH_MIN_BYTES:-1024}
      KAFKA_FETCH_MAX_BYTES: ${KAFKA_FETCH_MAX_BYTES:-52428800}
      KAFKA_MAX_WAIT_MS: ${KAFKA_MAX_WAIT_MS:-500}
      KAFKA_SESSION_TIMEOUT_MS: ${KAFKA_SESSION_TIMEOUT_MS:-30000}
      KAFKA_HEARTBEAT_INTERVAL_MS: ${KAFKA_HEARTBEAT_INTERVAL_MS:-10000}
      POSTGRES_URL: postgres://${POSTGRES_USER:-harness_user}:${POSTGRES_PASSWORD:-harness_password}@postgres:5432/${POSTGRES_DB:-harness_db}?sslmode=disable
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-harness_password}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_PATH: ${API_BASE_PATH:-/v1}
    container_name: harness-frontend
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

  producer:
    build: ./backend
    container_name: harness-producer
    profiles: ["producer"]
    entrypoint: ["./producer"]
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-agent-harness-metrics}
      KAFKA_ACKS: ${KAFKA_ACKS:-all}
      KAFKA_COMPRESSION: ${KAFKA_COMPRESSION:-snappy}
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE:-16384}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS:-10}
    depends_on:
      kafka:
        condition: service_healthy

  backend-dev:
    build: ./backend
    container_name: harness-backend-dev
    profiles: ["dev"]
    entrypoint: ["sh", "-c", "go run ./cmd/server"]
    working_dir: /src
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      API_BASE_PATH: ${API_BASE_PATH:-/v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-agent-harness-metrics}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-agent-metrics-analyzer}
      KAFKA_START_OFFSET: ${KAFKA_START_OFFSET:-last}
      POSTGRES_URL: postgres://${POSTGRES_USER:-harness_user}:${POSTGRES_PASSWORD:-harness_password}@postgres:5432/${POSTGRES_DB:-harness_db}?sslmode=disable
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-harness_password}
    volumes:
      - ./backend:/src
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: harness-frontend-dev
    profiles: ["dev"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend-dev:8080
      VITE_API_BASE_PATH: ${API_BASE_PATH:-/v1}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  kafka_data:
